apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-web
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-web
    spec:
      containers:
        - name: web
          image: busybox:1.36
          command: ['sh', '-c', 'while true; do sleep 5; done']
          resources:
            limits:
              cpu: 50m
              memory: 16Mi
