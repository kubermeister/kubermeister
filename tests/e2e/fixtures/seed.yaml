apiVersion: v1
kind: Namespace
metadata:
  name: km-e2e
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: km-e2e
data:
  greeting: hello-from-e2e
  LOG_LEVEL: debug
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: km-e2e
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: busybox:1.36
          command: ['sh', '-c', 'while true; do echo km-e2e-marker; sleep 5; done']
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: 100m
              memory: 32Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: import
  namespace: km-e2e
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: import
          image: busybox:1.36
          command: ['sh', '-c', 'echo imported']
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly
  namespace: km-e2e
spec:
  schedule: '0 2 * * *'
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: tick
              image: busybox:1.36
              command: ['sh', '-c', 'echo tick']
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: km-e2e
type: Opaque
data:
  # "super-secret-value"; the app reads it only for the key the user reveals or copies.
  password: c3VwZXItc2VjcmV0LXZhbHVl
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-quota
  namespace: km-e2e
spec:
  hard:
    pods: '20'
    requests.cpu: '4'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: team-limits
  namespace: km-e2e
spec:
  limits:
    - type: Container
      min:
        cpu: 10m
      default:
        cpu: 500m
      max:
        cpu: '2'
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: km-e2e
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: km-e2e
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 128Mi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: reader
  namespace: km-e2e
rules:
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'list']
  - apiGroups: ['']
    resources: ['configmaps']
    verbs: ['get']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reader-binding
  namespace: km-e2e
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: reader
subjects:
  - kind: ServiceAccount
    name: default
    namespace: km-e2e
---
# An autoscaler over the seeded deployment, so the bounds editor has something real to adjust.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: km-e2e
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
---
# The objects revision 2 of the demo release rendered, applied here the way Helm would have applied
# them: a rollback has to find them in the cluster, not only in the release's own record.
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-config
  namespace: km-e2e
data:
  colour: green
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-extra
  namespace: km-e2e
data:
  note: only-in-v2
---
# Helm keeps one Secret per release revision; the cluster runs no Helm controller here, so the
# release the add-on screens read is seeded directly. Each revision carries a rendered `manifest`:
# revision 1 renders the demo-config ConfigMap as blue, revision 2 makes it green and adds
# demo-extra, so a rollback has something real to apply and take away. `release` is
# base64(gzip(release json)),
# which the API base64-encodes once more.
apiVersion: v1
kind: Secret
metadata:
  name: sh.helm.release.v1.demo.v1
  namespace: km-e2e
  labels:
    owner: helm
    name: demo
type: helm.sh/release.v1
data:
  release: 
---
apiVersion: v1
kind: Secret
metadata:
  name: sh.helm.release.v1.demo.v2
  namespace: km-e2e
  labels:
    owner: helm
    name: demo
type: helm.sh/release.v1
data:
  release: 
---
# A budget that covers no running pod on purpose: it lists as Blocked, which is the state worth
# seeing on the screen, without standing between the eviction specs and the pods they evict.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: km-e2e
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: web-budgeted
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: km-e2e-high
value: 1000
globalDefault: false
description: Seeded so the priority class list has a row of its own.
---
# A lease of our own, so the Leases screen has a row inside the seeded namespace rather than only
# the control-plane ones in kube-node-lease.
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: km-e2e-leader
  namespace: km-e2e
spec:
  holderIdentity: km-e2e-1
  leaseDurationSeconds: 15
---
# k3s creates no RuntimeClass or IngressClass of its own (traefik is disabled in the harness), so
# the class screens are seeded with one each.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: km-e2e-runtime
handler: runc
scheduling:
  nodeSelector:
    kubernetes.io/os: linux
overhead:
  podFixed:
    cpu: 10m
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: km-e2e-ingress
  annotations:
    ingressclass.kubernetes.io/is-default-class: 'true'
spec:
  controller: example.com/km-e2e
---
# A capacity object is a plain API object: no CSI driver has to exist for the screen to have a row.
apiVersion: storage.k8s.io/v1
kind: CSIStorageCapacity
metadata:
  name: km-e2e-capacity
  namespace: km-e2e
storageClassName: local-path
capacity: 10Gi
maximumVolumeSize: 5Gi
nodeTopology:
  matchLabels:
    kubernetes.io/os: linux
---
# Admission configurations of our own, so the screens have rows. Both fail open and time out in a
# second against a service that does not exist: they must never stand between a later spec and its
# write. Their rules name a resource no spec creates.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: km-e2e-mutating
webhooks:
  - name: mutate.km-e2e.test
    failurePolicy: Ignore
    timeoutSeconds: 1
    sideEffects: None
    admissionReviewVersions: ['v1']
    clientConfig:
      service:
        name: km-e2e-absent
        namespace: km-e2e
        path: /mutate
    rules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE']
        resources: ['persistentvolumeclaims']
        scope: Namespaced
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: km-e2e-validating
webhooks:
  - name: validate.km-e2e.test
    failurePolicy: Ignore
    timeoutSeconds: 1
    sideEffects: None
    admissionReviewVersions: ['v1']
    clientConfig:
      service:
        name: km-e2e-absent
        namespace: km-e2e
        path: /validate
    rules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE']
        resources: ['persistentvolumeclaims']
        scope: Namespaced
---
# A policy with no binding judges nothing; it exists so the screen has a row of its own.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: km-e2e-policy
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: ['apps']
        apiVersions: ['v1']
        operations: ['CREATE']
        resources: ['deployments']
  validations:
    - expression: 'true'
---
# A definition of our own, so the instance browser has a kind to browse that is not the cluster's
# own plumbing. Its printer columns are what the instance list must render.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.km-e2e.test
spec:
  group: km-e2e.test
  scope: Namespaced
  names:
    plural: widgets
    singular: widget
    kind: Widget
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Size
          type: string
          jsonPath: .spec.size
        - name: Ready
          type: boolean
          jsonPath: .status.ready
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size:
                  type: string
            status:
              type: object
              properties:
                ready:
                  type: boolean
