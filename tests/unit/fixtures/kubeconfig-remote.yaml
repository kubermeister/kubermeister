apiVersion: v1
kind: Config
current-context: remote
clusters:
  - name: remote-cluster
    cluster:
      server: https://api.corp.example:6443
      insecure-skip-tls-verify: true
users:
  - name: remote-user
    user:
      token: remote-token
contexts:
  - name: remote
    context:
      cluster: remote-cluster
      user: remote-user
