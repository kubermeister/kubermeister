# A file that loads, with contexts the library lists and switches to but cannot back: the current
# one names a cluster that is not there (removed with `kubectl config delete-cluster`, or a typo),
# another names a user that is not there. `beta` is whole.
apiVersion: v1
kind: Config
current-context: alpha
clusters:
  - name: beta-cluster
    cluster:
      server: https://127.0.0.1:2
      insecure-skip-tls-verify: true
users:
  - name: alpha-user
    user:
      token: alpha-token
  - name: beta-user
    user:
      token: beta-token
contexts:
  - name: alpha
    context:
      cluster: nowhere
      user: alpha-user
  - name: ghost-user
    context:
      cluster: beta-cluster
      user: nobody
  - name: beta
    context:
      cluster: beta-cluster
      user: beta-user
