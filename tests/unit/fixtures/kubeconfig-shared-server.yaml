apiVersion: v1
kind: Config
current-context: reader
clusters:
  - name: shared-cluster
    cluster:
      server: https://127.0.0.1:1
      insecure-skip-tls-verify: true
  - name: other-cluster
    cluster:
      server: https://127.0.0.1:2
      insecure-skip-tls-verify: true
users:
  - name: reader-user
    user:
      token: reader-token
contexts:
  - name: reader
    context:
      cluster: shared-cluster
      user: reader-user
      namespace: team-a
  - name: reader-b
    context:
      cluster: shared-cluster
      user: reader-user
      namespace: team-b
  - name: elsewhere
    context:
      cluster: other-cluster
      user: reader-user
      namespace: team-z
