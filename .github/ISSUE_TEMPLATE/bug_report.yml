name: Bug report
description: Something the app does wrong, or does not do at all.
type: Bug
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please never paste a kubeconfig, a token, a Secret's contents or
        anything else from your cluster you would not put on a public page. Redact names if you
        need to; the shape of the problem matters more than the names in it.

        If this is a security problem, do not file it here: see
        [SECURITY.md](https://github.com/kubermeister/kubermeister/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what the app did, and what you expected instead.
      placeholder: |
        1. Opened the Pods list in namespace `web`
        2. Clicked a pod, then the Logs tab
        3. Turned Live on
        The console stayed empty; `kubectl logs -f` on the same pod prints lines.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: From Settings › About.
      placeholder: 0.4.3
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Windows
        - Linux (AppImage)
        - Linux (deb)
    validations:
      required: true
  - type: input
    id: kubernetes
    attributes:
      label: Kubernetes
      description: Distribution and server version, as `kubectl version` reports it.
      placeholder: EKS 1.34, k3s v1.36.4, kind 1.35, ...
  - type: dropdown
    id: auth
    attributes:
      label: How the context authenticates
      description: Helps when the problem is reaching the cluster at all.
      options:
        - Client certificate or static token
        - Exec credential plugin (aws, gke-gcloud-auth-plugin, kubelogin, ...)
        - OIDC
        - Not sure
  - type: textarea
    id: logs
    attributes:
      label: Anything the app said
      description: Error text, a toast, or output from the developer tools console. Redact as needed.
      render: text
