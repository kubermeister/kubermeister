# Sections for the release notes `gh release create --generate-notes` writes in release.yml. A pull
# request lands in the first category whose label it carries; pr-labels.yml sets that label from the
# title's type, so nobody labels a pull request by hand. The version bump PR is left out.
changelog:
  exclude:
    labels: [release]
  categories:
    - title: Features
      labels: [feature]
    - title: Fixes
      labels: [bug]
    - title: Performance
      labels: [performance]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other
      labels: ['*']
