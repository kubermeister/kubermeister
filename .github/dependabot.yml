version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A week between a version's publication and its pull request: a package compromised on the
    # registry is usually pulled within days, and nothing here needs a dependency the day it ships.
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ['*']
    # Majors held back on purpose: typescript-eslint supports TypeScript below 6.1 only,
    # electron-vite 5 requires Vite 7, and @types/node tracks the Node bundled with Electron.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: vite
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # v6 peers on Vite 8, which electron-vite 5 does not accept; it can follow the Vite pin above.
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']
      # v9 is a different API (createCoreRowModel, ReactTable); the table templates target v8.
      - dependency-name: '@tanstack/react-table'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps)
    # Only labels .github/labels.yml knows; without this Dependabot adds its own "javascript".
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore(deps)
    labels: [dependencies]
