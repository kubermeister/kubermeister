name: Package and upload
description: >
  Build, package with electron-builder, and upload installers plus electron-updater metadata to a
  GitHub release. Signs and notarizes macOS when the Apple secrets are passed in; otherwise ad-hoc
  signs so the bundle stays openable.

inputs:
  release-tag:
    description: Release tag to upload to (must already exist).
    required: true
  github-token:
    required: true
  csc-link:
    description: Base64 .p12 with the Developer ID Application certificate. Empty = unsigned.
    required: false
    default: ''
  csc-key-password:
    required: false
    default: ''
  apple-id:
    required: false
    default: ''
  apple-app-specific-password:
    required: false
    default: ''
  apple-team-id:
    required: false
    default: ''

runs:
  using: composite
  steps:
    - run: npm run build
      shell: bash

    # electron-builder builds the rpm with the host's own rpmbuild, which the Ubuntu images lack.
    - name: Install rpmbuild for the rpm
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

    - name: Package
      shell: bash
      env:
        # Secrets arrive as inputs and are exported only when non-empty: electron-builder treats a
        # defined-but-empty CSC_LINK as a certificate path and fails with "not a file".
        IN_CSC_LINK: ${{ inputs.csc-link }}
        IN_CSC_KEY_PASSWORD: ${{ inputs.csc-key-password }}
        IN_APPLE_ID: ${{ inputs.apple-id }}
        IN_APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.apple-app-specific-password }}
        IN_APPLE_TEAM_ID: ${{ inputs.apple-team-id }}
      run: |
        flags=()
        if [ "$RUNNER_OS" = macOS ]; then
          if [ -n "$IN_CSC_LINK" ]; then
            # Developer ID signing; hardened runtime stays on (electron-builder.yml default).
            export CSC_LINK="$IN_CSC_LINK" CSC_KEY_PASSWORD="$IN_CSC_KEY_PASSWORD"
            if [ -n "$IN_APPLE_ID" ]; then
              # Notarize and staple so Gatekeeper opens the app with no dialog.
              export APPLE_ID="$IN_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$IN_APPLE_APP_SPECIFIC_PASSWORD" APPLE_TEAM_ID="$IN_APPLE_TEAM_ID"
              flags+=(-c.mac.notarize=true)
            fi
          else
            # No certificate (forks, local): ad-hoc sign so the bundle signature is valid and
            # Gatekeeper shows the unverified-developer dialog instead of "damaged". Hardened
            # runtime only matters for notarization and blocks ad-hoc library validation.
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            flags+=(-c.mac.identity=- -c.mac.hardenedRuntime=false)
          fi
        fi
        npm run package -- "${flags[@]}"

    # The installer names carry the version, so a rerun of a failed release never overwrites an
    # asset a published feed still points at; the previous release stays whole until its own
    # feed has moved. The feeds are found rather than named: see the script.
    - name: Name this runner's installers and feeds
      id: files
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/name-assets.sh"

    - name: Upload installers
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ inputs.release-tag }}
        FILES: ${{ steps.files.outputs.installers }}
      run: bash "$GITHUB_ACTION_PATH/upload.sh"

    # Checked before any feed may name them.
    - name: Verify the uploaded installers
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ inputs.release-tag }}
        FILES: ${{ steps.files.outputs.installers }}
      run: bash "$GITHUB_ACTION_PATH/verify-uploads.sh"

    # Metadata last: a feed is what a running app reads, so it names only assets that exist and
    # have been checked. Overwriting the previous feed is the one in-place write here.
    - name: Upload updater metadata
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ inputs.release-tag }}
        FILES: ${{ steps.files.outputs.feeds }}
      run: bash "$GITHUB_ACTION_PATH/upload.sh"

    # Read back like the installers, so a feed that never arrived, or arrived as something else,
    # fails the release rather than leaving that build's users on the version they have.
    - name: Verify the uploaded updater metadata
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ inputs.release-tag }}
        FILES: ${{ steps.files.outputs.feeds }}
      run: bash "$GITHUB_ACTION_PATH/verify-uploads.sh"
