name: PR title

# The squash commit on main takes the PR title, so the title is validated against the same rules as
# .githooks/commit-msg. Separate from ci.yml so it also runs on `edited` without rebuilding
# everything. Runs on `pull_request` (not `pull_request_target`) and checks nothing out, so there is
# no untrusted code path.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: true
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            chore
            ci
            build
            style
            revert
          scopes: |
            repo
            main
            preload
            renderer
            shared
            ipc
            k8s
            charts
            build
            ci
            deps
            docs
            release
          subjectPattern: ^[a-z0-9][^A-Z]*[^.]$
          subjectPatternError: |
            The subject "{subject}" must be lowercase, imperative, and not end with a period.
