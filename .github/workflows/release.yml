name: Release

# Stable release: pushing a vX.Y.Z tag whose version matches package.json builds, packages and
# publishes a versioned GitHub release. Cutting a release = merge the version bump PR, then
# `git tag vX.Y.Z && git push origin vX.Y.Z`.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

# Never cancel a half-published release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The ancestry check below needs main's history, not only the tagged commit.
          fetch-depth: 0
      - name: Tag must match package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
      # A release is a commit that went through a pull request and its checks. A tag on any other
      # commit would still build, publish as latest and update the cask, so it is refused here,
      # before anything is built.
      - name: Tagged commit must be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"
            exit 1
          fi

  ci:
    name: ci
    needs: verify
    uses: ./.github/workflows/ci.yml

  # The release is created as a draft first so it never appears half-populated; `publish`
  # flips it public once every platform has uploaded.
  draft:
    name: create draft release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the draft release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # --notes is prepended to the generated list, so the written account of the release
            # sits above the pull request titles rather than replacing them.
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "Kubermeister ${GITHUB_REF_NAME#v}" \
              --notes "[What changed in this release](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)" \
              --generate-notes
          fi

  package:
    name: package (${{ matrix.os }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache here: this job's output is what users install, and a cache entry written by
      # any other workflow run would otherwise feed straight into it. setup-node caches by default.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          package-manager-cache: false
      - run: npm ci
      - uses: ./.github/actions/package
        with:
          release-tag: ${{ github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          csc-link: ${{ secrets.CSC_LINK }}
          csc-key-password: ${{ secrets.CSC_KEY_PASSWORD }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-app-specific-password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}

  publish:
    name: publish release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Presence flag only; the token itself is used solely by the tap checkout below.
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
      # Presence flag only; the token itself is used solely by the dispatch below.
      HAS_SITE_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN != '' }}
    steps:
      # Installers are unsigned on Windows and on Linux, so a checksum is the only way to tell a
      # good download from a truncated or tampered one. The digests come from the release itself
      # rather than from re-hashing 800 MB of assets: the packaging action already compared each
      # one against the file it uploaded, so a wrong digest would have failed the release there.
      # Written before the release goes public, so it is never visible without its checksums.
      - name: Publish the checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Installers only: the *.yml feeds are rewritten in place and the blockmaps are updater
          # plumbing, neither of which anybody checks a download against.
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | select(.name | test("\\.(dmg|zip|exe|AppImage|deb)$")) | "\(.digest)  \(.name)"' \
            | sed 's/^sha256://' | sort -k2 > SHA256SUMS
          test -s SHA256SUMS || { echo "::error::no installers to checksum"; exit 1; }
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

      - name: Make the release public and latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      # Homebrew cask: render the template with this version and the dmg checksums, push to the
      # tap. Skipped when HOMEBREW_TAP_TOKEN is not configured so the release itself never blocks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_TAP_TOKEN == 'true'
        with:
          persist-credentials: false
      # This checkout keeps its token on purpose: the step below pushes the cask with it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        if: env.HAS_TAP_TOKEN == 'true'
        with:
          repository: kubermeister/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Render and push the cask
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*-mac-*.dmg' --dir dmgs
          SHA_ARM=$(sha256sum "dmgs/Kubermeister-$VERSION-mac-arm64.dmg" | cut -d' ' -f1)
          SHA_INTEL=$(sha256sum "dmgs/Kubermeister-$VERSION-mac-x64.dmg" | cut -d' ' -f1)
          mkdir -p homebrew-tap/Casks
          sed -e "s/__VERSION__/$VERSION/g" -e "s/__SHA_ARM__/$SHA_ARM/g" -e "s/__SHA_INTEL__/$SHA_INTEL/g" \
            packaging/homebrew/kubermeister.rb.tmpl > homebrew-tap/Casks/kubermeister.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/kubermeister.rb
          git diff --cached --quiet && { echo "cask unchanged"; exit 0; }
          git commit -m "kubermeister $VERSION"
          git push

      # kubermeister.com reads this repository's latest release and CHANGELOG.md at build time, so
      # without this the download page keeps offering the previous version until somebody pushes to
      # the website repository for an unrelated reason. It runs last, after the release is public,
      # because the site's build asks the API for the *latest* release. Skipped when the token is
      # not configured, so a release never blocks on it.
      - name: Ask the website to rebuild
        if: env.HAS_SITE_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          printf '{"event_type":"release-published","client_payload":{"version":"%s"}}' \
            "${GITHUB_REF_NAME#v}" \
            | gh api repos/kubermeister/website/dispatches --method POST --input -
