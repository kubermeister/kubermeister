name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # release.yml calls this workflow as its gate before packaging.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Source-level analysis has no platform-dependent behavior: run it once on the cheap runner.
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # The workflows are code too. actionlint checks their syntax, expressions and shell steps;
      # zizmor checks their security posture (pinning, credentials left in checkouts, caches on
      # publishing jobs, dangerous triggers). A finding fails the job; a deliberate exception carries
      # an inline `# zizmor: ignore[audit]` with a comment saying why.
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          min-severity: medium
          advanced-security: false

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci
      # Coverage thresholds live in vitest.config.ts and fail the run when not met.
      - run: npm run test:coverage

  # End to end against a disposable k3s container: ubuntu only, since Docker is available there.
  # Electron needs a display, hence xvfb. No Playwright browsers are installed: the suite drives
  # the built Electron app itself.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: xvfb-run --auto-servernum npm run test:e2e
      # A flake that passes on rerun leaves nothing behind but this: the traces, the window's state
      # and its last screenshot, which the harness keeps for failed tests only.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  # The artifact users install, started. Everything else in this file tests `out/` through the
  # development Electron binary, so a packaged build that cannot launch passes every other gate —
  # which is how the AppImage shipped needing a library Ubuntu dropped (#299). Linux only: it is
  # where both packages are cheap to build and where one of them is a bare binary with its own
  # runtime, and packaging three OSes on every pull request would cost more than it catches.
  package:
    name: package smoke (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package

      # A window that stays open is the signal: the app is meant to keep running, so `timeout`
      # killing it is success and anything else is the process giving up on its own.
      - name: The AppImage starts
        run: |
          app=$(ls release/*.AppImage)
          chmod +x "$app"
          # The step's shell runs under `-e`: without this the timeout's own exit status would
          # abort before it can be read, and a killed process is what success looks like here.
          set +e
          KUBERMEISTER_USER_DATA=$(mktemp -d) KUBECONFIG=/nonexistent \
            timeout --signal=TERM 30 xvfb-run --auto-servernum "$app" > appimage.log 2>&1
          code=$?
          set -e
          cat appimage.log
          if grep -qi 'libfuse' appimage.log; then
            echo "::error::the AppImage runtime still wants libfuse"
            exit 1
          fi
          if [ "$code" -ne 124 ]; then
            echo "::error::the AppImage exited on its own with $code"
            exit 1
          fi

      - name: The deb installs and starts
        run: |
          set -euo pipefail
          deb=$(ls release/*.deb)
          sudo apt-get install -y "./$deb"
          name=$(dpkg-deb -f "$deb" Package)
          # The package registers /usr/bin/<name> through update-alternatives, so what gets started
          # here is the command a user would type rather than a path under /opt we guessed at.
          bin=$(command -v "$name")
          echo "installed $name, starting $bin"
          set +e
          KUBERMEISTER_USER_DATA=$(mktemp -d) KUBECONFIG=/nonexistent \
            timeout --signal=TERM 30 xvfb-run --auto-servernum "$bin" > deb.log 2>&1
          code=$?
          set -e
          cat deb.log
          if [ "$code" -ne 124 ]; then
            echo "::error::the installed app exited on its own with $code"
            exit 1
          fi

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run build
