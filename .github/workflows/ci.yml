name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # release.yml calls this workflow as its gate before packaging.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Source-level analysis has no platform-dependent behavior: run it once on the cheap runner.
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # The workflows are code too. actionlint checks their syntax, expressions and shell steps;
      # zizmor checks their security posture (pinning, credentials left in checkouts, caches on
      # publishing jobs, dangerous triggers). A finding fails the job; a deliberate exception carries
      # an inline `# zizmor: ignore[audit]` with a comment saying why.
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          min-severity: medium
          advanced-security: false

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci
      # Coverage thresholds live in vitest.config.ts and fail the run when not met.
      - run: npm run test:coverage

  # End to end against a disposable k3s container: ubuntu only, since Docker is available there.
  # Electron needs a display, hence xvfb. No Playwright browsers are installed: the suite drives
  # the built Electron app itself.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: xvfb-run --auto-servernum npm run test:e2e

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run build
