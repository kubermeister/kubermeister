# Throwaway feasibility spike for #198, Windows half: a Linux Docker daemon inside WSL2 reached
# from Windows over loopback. Removed before the pull request leaves draft.
name: e2e spike windows

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-spike-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Option (a) on Windows: a Linux Docker daemon inside WSL2, reached from Windows over loopback TCP.
  windows-wsl-docker:
    name: spike windows wsl2 docker e2e (${{ matrix.attempt }})
    # Two identical runs per push, to catch an intermittent spec sooner.
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: wsl --version; wsl --status; wsl -l -v; exit 0
      # Imported from Ubuntu's own WSL image rather than through a marketplace action (the
      # repository allows none outside its list) or `wsl --install`, whose first launch asks for a user.
      - name: import an ubuntu distribution as wsl2
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $base = 'https://cloud-images.ubuntu.com/wsl/releases/noble/current'
          $file = 'ubuntu-noble-wsl-amd64-wsl.rootfs.tar.gz'
          curl.exe -fsSL -o "$env:RUNNER_TEMP\$file" "$base/$file"
          curl.exe -fsSL -o "$env:RUNNER_TEMP\SHA256SUMS" "$base/SHA256SUMS"
          $want = (Select-String -Path "$env:RUNNER_TEMP\SHA256SUMS" -Pattern " \*?$file$").Line.Split(' ')[0]
          $got = (Get-FileHash "$env:RUNNER_TEMP\$file" -Algorithm SHA256).Hash.ToLower()
          if ($want -ne $got) { throw "checksum mismatch: $got, expected $want" }
          wsl --import km "$env:RUNNER_TEMP\wsl-km" "$env:RUNNER_TEMP\$file" --version 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wsl -l -v
          wsl -d km -u root -- uname -a
          "imported after $([int]$sw.Elapsed.TotalSeconds)s"
      - name: install docker in wsl
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          wsl -d km -u root --exec sh -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq docker.io > /dev/null'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "installed after $([int]$sw.Elapsed.TotalSeconds)s"
      # Which networking mode lets Windows reach a Linux listener on 127.0.0.1: NAT's localhost
      # forwarding first, then mirrored networking, which shares one loopback between the two.
      - name: find a loopback path from windows to dockerd
        run: |
          "--- .wslconfig"; Get-Content "$env:USERPROFILE\.wslconfig" -ErrorAction SilentlyContinue
          # The image boots systemd, which owns dockerd; a daemon started from `wsl --exec` dies with
          # that call, so the TCP listener is added to the service itself.
          function Start-Dockerd($bind) {
            Start-Process -WindowStyle Hidden wsl -ArgumentList '-d','km','-u','root','--exec','sleep','infinity'
            Start-Sleep 3
            wsl -d km -u root --exec sh -c "mkdir -p /etc/systemd/system/docker.service.d && printf '[Service]\nExecStart=\nExecStart=/usr/bin/dockerd -H fd:// -H tcp://${bind}:2375 --containerd=/run/containerd/containerd.sock\n' > /etc/systemd/system/docker.service.d/tcp.conf && systemctl daemon-reload && systemctl restart docker"
            wsl -d km -u root --exec sh -c 'for i in $(seq 60); do docker info > /dev/null 2>&1 && break; sleep 1; done; ip -4 -o addr show; ss -ltnp | grep -E "State|dockerd"; systemctl is-active docker'
          }
          function Test-Loopback($label) {
            $code = curl.exe -s -m 5 -o NUL -w '%{http_code}' http://127.0.0.1:2375/_ping
            Write-Host "$label -> 127.0.0.1:2375/_ping answered '$code'"
            $code -eq '200'
          }
          Start-Dockerd '127.0.0.1'
          if (Test-Loopback 'nat, bound to 127.0.0.1') { "WSL_MODE=nat-loopback" >> $env:GITHUB_ENV; exit 0 }
          Start-Dockerd '0.0.0.0'
          if (Test-Loopback 'nat, bound to 0.0.0.0') { "WSL_MODE=nat-any" >> $env:GITHUB_ENV; exit 0 }
          "[wsl2]`nnetworkingMode=mirrored" | Set-Content "$env:USERPROFILE\.wslconfig"
          wsl --shutdown
          Start-Sleep 8
          Start-Dockerd '127.0.0.1'
          if (Test-Loopback 'mirrored, bound to 127.0.0.1') { "WSL_MODE=mirrored" >> $env:GITHUB_ENV; exit 0 }
          wsl -d km -u root --exec sh -c 'journalctl -u docker --no-pager | tail -20'
          exit 1
      - name: docker from windows
        run: |
          "mode: $env:WSL_MODE"
          $env:DOCKER_HOST = 'tcp://127.0.0.1:2375'
          docker version
          docker run --rm -p 18080:80 -d --name probe nginx:alpine
          Start-Sleep 5
          curl.exe -sS -o NUL -w "nginx via forwarded port: %{http_code}`n" http://127.0.0.1:18080/
          docker rm -f probe
      - run: npm ci
      - run: npm run build
      - name: e2e
        env:
          DOCKER_HOST: tcp://127.0.0.1:2375
          TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
          # Keep the cluster after the suite, so a failure can be asked what the cluster holds.
          KM_E2E_KEEP_CLUSTER: '1'
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          npm run test:e2e
          $code = $LASTEXITCODE
          "suite exit $code after $([int]$sw.Elapsed.TotalSeconds)s"
          exit $code
      - name: what the cluster holds after a failure
        if: failure()
        env:
          DOCKER_HOST: tcp://127.0.0.1:2375
        run: |
          docker exec km-e2e-cluster kubectl get crd widgets.km-e2e.test -o wide
          docker exec km-e2e-cluster kubectl get widgets -A -o wide
          docker exec km-e2e-cluster kubectl get widgets -n km-e2e -o yaml
          docker exec km-e2e-cluster kubectl get events -n km-e2e --field-selector involvedObject.kind=Widget
          exit 0
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results-windows-${{ matrix.attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
