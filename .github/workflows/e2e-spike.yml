# Throwaway feasibility spike for #198: which way can a disposable k3s cluster reach the
# end-to-end suite on macOS and Windows runners. Removed before the pull request leaves draft.
name: e2e spike

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Not cancelled by a newer push, so a long macOS run finishes while the Windows spike iterates.
concurrency:
  group: e2e-spike-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Option (a) on Apple silicon: expected to fail, since the M1 hosts expose no nested virtualization.
  mac-arm-probe:
    name: spike mac arm64 probe
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - run: |
          uname -m; sw_vers
          sysctl kern.hv_support || true
          sysctl -a | grep -i -E 'hv_|vmm' || true
      - run: brew install colima docker
      - name: colima start
        run: |
          set +e
          start=$(date +%s)
          timeout 300 colima start --cpu 2 --memory 4
          echo "colima exit $? after $(( $(date +%s) - start ))s"
          colima status || true

  # Option (a) on Intel macOS: colima's own CI runs here. Runs the real suite through Testcontainers.
  mac-intel-colima:
    name: spike mac intel colima e2e
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: sysctl kern.hv_support machdep.cpu.brand_string || true
      - run: brew install colima docker
      - name: colima start
        run: |
          # macOS has no timeout(1); an alarm survives exec and kills a start that hangs.
          limit() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          logs() { tail -40 ~/.colima/_lima/colima/ha.stderr.log 2>/dev/null || true; }
          start=$(date +%s)
          if limit 600 colima start --cpu 3 --memory 8 --vm-type vz; then
            echo "colima (vz) up after $(( $(date +%s) - start ))s"
          else
            echo "vz failed after $(( $(date +%s) - start ))s"; logs
            colima delete -f || true
            start=$(date +%s)
            limit 900 colima start --cpu 3 --memory 8 --vm-type qemu || { echo "qemu failed after $(( $(date +%s) - start ))s"; logs; exit 1; }
            echo "colima (qemu) up after $(( $(date +%s) - start ))s"
          fi
          docker version
      - name: time a bare k3s boot inside colima
        run: |
          docker pull -q rancher/k3s:v1.36.4-k3s1
          start=$(date +%s)
          docker run -d --privileged --cgroupns=host --name k3s-probe rancher/k3s:v1.36.4-k3s1 server --disable=traefik --disable=servicelb --disable=metrics-server
          for _ in $(seq 120); do docker logs k3s-probe 2>&1 | grep -q 'Node controller sync successful' && break; sleep 5; done
          echo "k3s ready after $(( $(date +%s) - start ))s"
          docker exec k3s-probe kubectl get nodes || true
          docker rm -f k3s-probe
          sysctl -n hw.ncpu hw.memsize; colima list
      - run: npm ci
      - run: npm run build
      - name: e2e
        env:
          KM_E2E_STARTUP_TIMEOUT_MS: '600000'
        run: |
          export DOCKER_HOST="unix://$HOME/.colima/default/docker.sock"
          export TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE=/var/run/docker.sock
          start=$(date +%s)
          set +e
          npm run test:e2e
          code=$?
          echo "suite exit $code after $(( $(date +%s) - start ))s"
          exit $code
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results-macos-intel
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  # Option (b): k3s on ubuntu published through a public TCP relay, probed from an arm64 Mac.
  # Only reachability and latency are measured; no credential leaves the producer.
  tunnel-producer:
    name: spike tunnel producer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - run: |
          docker run -d --privileged --name k3s -p 127.0.0.1:6443:6443 rancher/k3s:v1.36.4-k3s1 server --disable=traefik
          curl -fsSL -o bore.tgz https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz
          tar xzf bore.tgz
          nohup ./bore local 6443 --to bore.pub > bore.log 2>&1 &
          for _ in $(seq 30); do grep -q 'listening at' bore.log && break; sleep 1; done
          cat bore.log
          port=$(grep -o 'bore.pub:[0-9]*' bore.log | head -1 | cut -d: -f2)
          echo "PORT=$port" >> "$GITHUB_ENV"
          mkdir -p sig && touch sig/port
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tunnel-port-${{ env.PORT }}
          path: sig/port
      - name: wait for the consumer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          start=$(date +%s)
          for _ in $(seq 120); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].name' | grep -q tunnel-done && break
            sleep 10
          done
          echo "waited $(( $(date +%s) - start ))s for the consumer"

  tunnel-consumer:
    name: spike tunnel consumer (mac arm64)
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: find the tunnel and probe it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          start=$(date +%s)
          for _ in $(seq 90); do
            name=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].name' | grep tunnel-port- || true)
            [ -n "$name" ] && break
            sleep 10
          done
          echo "found $name after $(( $(date +%s) - start ))s"
          port=${name#tunnel-port-}
          for _ in $(seq 20); do
            curl -sk -o /dev/null -w "%{http_code} connect=%{time_connect} tls=%{time_appconnect} total=%{time_total}\n" "https://bore.pub:$port/version"
          done
          mkdir -p sig && touch sig/done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tunnel-done
          path: sig/done
