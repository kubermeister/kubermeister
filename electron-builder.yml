appId: io.kubermeister.app
productName: Kubermeister
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
# Redistributing the bundled Electron/Chromium binaries requires their third-party notices, which
# electron-builder does not include by default.
extraResources:
  - from: node_modules/electron/dist/LICENSE
    to: LICENSE.electron.txt
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: LICENSES.chromium.html
# Deterministic asset names; the release workflows and any package manager templates depend on
# this exact pattern.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
# The publish block is never used to upload (the release workflow runs with --publish never and
# uses `gh release upload`). It exists so electron-builder emits the electron-updater metadata
# (latest*.yml, blockmaps) and embeds the GitHub releases feed into the app. Owner and repo come
# from package.json `repository`.
publish:
  provider: github
mac:
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    # electron-updater installs macOS updates from the zip, never the dmg.
    - target: zip
      arch: [arm64, x64]
  # Signing is controlled by CSC_* environment variables in CI; no `identity` key here, so no
  # credentials means an unsigned build, credentials present means signed with no config change.
  hardenedRuntime: true
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
linux:
  icon: resources/icon.png
  category: Development
  synopsis: Desktop Kubernetes client
  maintainer: Ararat Poghosyan <ararat.poghosyan@gmail.com>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
