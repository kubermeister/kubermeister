appId: io.kubermeister.app
productName: Kubermeister
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
# Redistributing the bundled Electron/Chromium binaries requires their third-party notices, which
# electron-builder does not include by default.
extraResources:
  - from: node_modules/electron/dist/LICENSE
    to: LICENSE.electron.txt
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: LICENSES.chromium.html
  # A Linux window carries its own icon (`windowIcon` in src/main/window.ts) and `files` packages
  # nothing but out/, so the master PNG ships as a resource. It is listed here rather than under
  # `linux:` because a platform block replaces this list instead of adding to it, which would drop
  # the notices above from the Linux builds.
  - from: resources/icon.png
    to: icon.png
# `kubermeister://` links (src/shared/deep-link.ts). One top-level entry serves every platform: the
# macOS Info.plist, the Windows registry keys the NSIS installer writes, and the Linux desktop
# entry, which electron-builder gives `MimeType=x-scheme-handler/kubermeister` and a `%U` in `Exec`.
# The scheme is load-bearing for every link anybody has copied, so it never changes.
protocols:
  - name: Kubermeister link
    schemes: [kubermeister]
# Deterministic asset names; the release workflows and any package manager templates depend on
# this exact pattern.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
# Electron fuses are switches flipped in the binary at package time and read before any JavaScript
# runs, so they hold for anyone who can start the app with their own arguments or environment.
# grantFileProtocolExtraPrivileges stays at its default: the packaged renderer is a file:// document.
electronFuses:
  # ELECTRON_RUN_AS_NODE=1 would turn the signed, notarized app into a plain Node binary.
  runAsNode: false
  # NODE_OPTIONS could preload a script into the main process.
  enableNodeOptionsEnvironmentVariable: false
  # --inspect and friends would open the main process to a debugger.
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  # A folder dropped next to app.asar can never shadow it.
  onlyLoadAppFromAsar: true
  # macOS validates the archive's hash at startup.
  enableEmbeddedAsarIntegrityValidation: true
  # Flipping fuses invalidates the ad-hoc signature an unsigned build carries; re-sign it so the
  # bundle still opens. A Developer ID build is signed after this step anyway.
  resetAdHocDarwinSignature: true
# The publish block is never used to upload (the release workflow runs with --publish never and
# uses `gh release upload`). It exists so electron-builder emits the electron-updater metadata
# (latest*.yml, blockmaps) and embeds the GitHub releases feed into the app. Owner and repo come
# from package.json `repository`.
publish:
  provider: github
mac:
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    # electron-updater installs macOS updates from the zip, never the dmg.
    - target: zip
      arch: [arm64, x64]
  # Signing is controlled by CSC_* environment variables in CI; no `identity` key here, so no
  # credentials means an unsigned build, credentials present means signed with no config change.
  hardenedRuntime: true
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
# The AppImage runtime electron-builder bundles. Its default, `0.0.0`, is the legacy toolset, whose
# runtime dlopens libfuse.so.2 — a library Ubuntu stopped shipping in 23.10, so that AppImage dies at
# launch with `dlopen(): error loading libfuse.so.2` until the user installs libfuse2t64 by hand. The
# newer toolset carries a static runtime that needs no FUSE at all. electron-builder still labels it
# a beta, which is the trade: a beta runtime against one that does not start on current Ubuntu.
toolsets:
  appimage: '1.0.3'
linux:
  icon: resources/icon.png
  category: Development
  synopsis: Desktop Kubernetes client
  maintainer: Ararat Poghosyan <ararat.poghosyan@gmail.com>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
